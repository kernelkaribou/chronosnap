<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14112a"/>
      <stop offset="100%" stop-color="#0c0918"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e8457e"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56b8d6"/>
      <stop offset="60%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e8457e"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)" stroke="url(#ring)" stroke-width="3"/>
  <!-- Outer lens ring -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.9"/>
  <!-- Aperture blades -->
  <g stroke="url(#lens)" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round">
    <line x1="64" y1="28" x2="64" y2="38"/>
    <line x1="64" y1="90" x2="64" y2="100"/>
    <line x1="28" y1="64" x2="38" y2="64"/>
    <line x1="90" y1="64" x2="100" y2="64"/>
    <line x1="38.5" y1="38.5" x2="45.6" y2="45.6"/>
    <line x1="82.4" y1="82.4" x2="89.5" y2="89.5"/>
    <line x1="89.5" y1="38.5" x2="82.4" y2="45.6"/>
    <line x1="45.6" y1="82.4" x2="38.5" y2="89.5"/>
  </g>
  <!-- Inner lens -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="url(#lens)" stroke-width="3" opacity="0.85"/>
  <!-- Clock hands — representing time/timelapse -->
  <line x1="64" y1="64" x2="64" y2="47" stroke="#e8e4f0" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="78" y2="58" stroke="#e8e4f0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Center dot -->
  <circle cx="64" cy="64" r="3" fill="#e8457e"/>
</svg>
