<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad-fill" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e8457e"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#56b8d6"/>
    </linearGradient>
    <linearGradient id="grad-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e4f0"/>
      <stop offset="100%" stop-color="#c4bdd8"/>
    </linearGradient>
    <linearGradient id="grad-tick" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c4bdd8"/>
      <stop offset="100%" stop-color="#e8e4f0"/>
    </linearGradient>
    <!-- Clip to outer ring area -->
    <clipPath id="ring-clip">
      <path d="M64 4 A60 60 0 1 1 63.99 4 Z M64 27 A37 37 0 1 0 64.01 27 Z" clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <!-- Ring area gradient fill (full donut, then lines on top) -->
  <circle cx="64" cy="64" r="59" fill="url(#grad-fill)" opacity="0.55"/>
  <circle cx="64" cy="64" r="37" fill="#0c0918"/>

  <!-- Dark structural lines over the ring -->
  <g stroke="#14112a" fill="none">
    <!-- Outer circle border -->
    <circle cx="64" cy="64" r="59" stroke-width="4"/>
    <!-- Inner circle border -->
    <circle cx="64" cy="64" r="37" stroke-width="4"/>
    <!-- Concentric ring midway -->
    <circle cx="64" cy="64" r="48" stroke-width="3.5"/>
    <!-- Crosshair lines -->
    <line x1="64" y1="5" x2="64" y2="27" stroke-width="4"/>
    <line x1="64" y1="101" x2="64" y2="123" stroke-width="4"/>
    <line x1="5" y1="64" x2="27" y2="64" stroke-width="4"/>
    <line x1="101" y1="64" x2="123" y2="64" stroke-width="4"/>
  </g>

  <!-- Inner dark clock face -->
  <circle cx="64" cy="64" r="35" fill="#0c0918"/>

  <!-- Subtle inner circle glow ring -->
  <circle cx="64" cy="64" r="35" fill="none" stroke="url(#grad-fill)" stroke-width="1.5" opacity="0.5"/>

  <!-- Clock tick marks: BOLD at 12, 3, 6, 9 -->
  <g stroke="url(#grad-tick)" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="31" x2="64" y2="38"/>
    <line x1="97" y1="64" x2="90" y2="64"/>
    <line x1="64" y1="97" x2="64" y2="90"/>
    <line x1="31" y1="64" x2="38" y2="64"/>
  </g>

  <!-- Clock tick marks: thin at 1,2,4,5,7,8,10,11 -->
  <g stroke="url(#grad-tick)" stroke-width="2" stroke-linecap="round">
    <line x1="80.5" y1="35" x2="78.5" y2="38.5"/>
    <line x1="93" y1="47.5" x2="89.5" y2="49.5"/>
    <line x1="93" y1="80.5" x2="89.5" y2="78.5"/>
    <line x1="80.5" y1="93" x2="78.5" y2="89.5"/>
    <line x1="47.5" y1="93" x2="49.5" y2="89.5"/>
    <line x1="35" y1="80.5" x2="38.5" y2="78.5"/>
    <line x1="35" y1="47.5" x2="38.5" y2="49.5"/>
    <line x1="47.5" y1="35" x2="49.5" y2="38.5"/>
  </g>

  <!-- Countdown segments between 6 and 9 (bottom-left arc) -->
  <g fill="none" stroke="url(#grad-tick)" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M60 95.5 A32 32 0 0 1 46.5 90"/>
    <path d="M43 87 A32 32 0 0 1 35 76.5"/>
    <path d="M33.5 73 A32 32 0 0 1 32.2 60"/>
  </g>

  <!-- Play triangle -->
  <polygon points="55,47 55,81 84,64" fill="url(#grad-play)"/>
</svg>
