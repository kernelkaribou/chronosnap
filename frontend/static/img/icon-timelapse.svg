<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad-ring" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e8457e"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#56b8d6"/>
    </linearGradient>
    <linearGradient id="grad-fill" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e8457e" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#56b8d6" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="grad-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e4f0"/>
      <stop offset="100%" stop-color="#c4bdd8"/>
    </linearGradient>
    <!-- Clip to outer ring area only -->
    <clipPath id="ring-clip">
      <path d="M64 2 A62 62 0 1 1 63.99 2 Z M64 28 A36 36 0 1 0 64.01 28 Z" clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#grad-ring)" stroke-width="4"/>

  <!-- Gradient fill in ring quadrants -->
  <path d="M64 6 A58 58 0 0 0 6 64 L28 64 A36 36 0 0 1 64 28 Z" fill="url(#grad-fill)"/>
  <path d="M6 64 A58 58 0 0 0 64 122 L64 100 A36 36 0 0 1 28 64 Z" fill="url(#grad-fill)"/>
  <path d="M64 122 A58 58 0 0 0 122 64 L100 64 A36 36 0 0 1 64 100 Z" fill="url(#grad-fill)"/>
  <path d="M122 64 A58 58 0 0 0 64 6 L64 28 A36 36 0 0 1 100 64 Z" fill="url(#grad-fill)"/>

  <!-- Aperture grid lines in outer ring (clipped to ring area) -->
  <g clip-path="url(#ring-clip)" opacity="0.3" stroke="url(#grad-ring)" fill="none">
    <!-- Concentric arcs -->
    <circle cx="64" cy="64" r="43" stroke-width="0.8"/>
    <circle cx="64" cy="64" r="51" stroke-width="0.8"/>
    <!-- Diagonal radial lines -->
    <line x1="44.6" y1="44.6" x2="20.6" y2="20.6" stroke-width="0.8"/>
    <line x1="83.4" y1="44.6" x2="107.4" y2="20.6" stroke-width="0.8"/>
    <line x1="83.4" y1="83.4" x2="107.4" y2="107.4" stroke-width="0.8"/>
    <line x1="44.6" y1="83.4" x2="20.6" y2="107.4" stroke-width="0.8"/>
  </g>

  <!-- Main crosshair lines dividing quadrants -->
  <g stroke="url(#grad-ring)" stroke-width="3.5" stroke-linecap="round">
    <line x1="64" y1="6" x2="64" y2="28"/>
    <line x1="64" y1="100" x2="64" y2="122"/>
    <line x1="6" y1="64" x2="28" y2="64"/>
    <line x1="100" y1="64" x2="122" y2="64"/>
  </g>

  <!-- Inner circle (dark face) -->
  <circle cx="64" cy="64" r="36" fill="#0c0918"/>
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#grad-ring)" stroke-width="3"/>

  <!-- Clock tick marks: BOLD at 12, 3, 6, 9 -->
  <g stroke="url(#grad-ring)" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="30" x2="64" y2="37"/>       <!-- 12 -->
    <line x1="98" y1="64" x2="91" y2="64"/>        <!-- 3 -->
    <line x1="64" y1="98" x2="64" y2="91"/>        <!-- 6 -->
    <line x1="30" y1="64" x2="37" y2="64"/>        <!-- 9 -->
  </g>

  <!-- Clock tick marks: normal at 1,2,4,5,7,8,10,11 -->
  <g stroke="url(#grad-ring)" stroke-width="2" stroke-linecap="round">
    <line x1="81" y1="34.6" x2="79" y2="38"/>      <!-- 1 -->
    <line x1="93.4" y1="47" x2="90" y2="49"/>       <!-- 2 -->
    <line x1="93.4" y1="81" x2="90" y2="79"/>       <!-- 4 -->
    <line x1="81" y1="93.4" x2="79" y2="90"/>       <!-- 5 -->
    <line x1="47" y1="93.4" x2="49" y2="90"/>       <!-- 7 -->
    <line x1="34.6" y1="81" x2="38" y2="79"/>       <!-- 8 -->
    <line x1="34.6" y1="47" x2="38" y2="49"/>       <!-- 10 -->
    <line x1="47" y1="34.6" x2="49" y2="38"/>       <!-- 11 -->
  </g>

  <!-- Countdown segments between 6 and 9 (bottom-left arc) -->
  <g fill="none" stroke="url(#grad-ring)" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <!-- Segment between 6 and 7 -->
    <path d="M60.1 95.8 A32 32 0 0 1 46.2 90.4"/>
    <!-- Segment between 7 and 8 -->
    <path d="M42.9 87 A32 32 0 0 1 34.5 76.3"/>
    <!-- Segment between 8 and 9 -->
    <path d="M33.3 72.6 A32 32 0 0 1 32.1 60"/>
  </g>

  <!-- Play triangle -->
  <polygon points="55,47 55,81 84,64" fill="url(#grad-play)"/>
</svg>
