<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Timelapse</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f14;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .shared-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        video {
            width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            background: #000;
        }
        .shared-actions {
            display: flex; gap: 0.75rem; align-items: center;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary {
            background: #7c3aed;
            color: #fff;
        }
        .error-msg {
            text-align: center;
            color: #999;
            font-size: 1.1rem;
        }
        .branding {
            color: #555;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="shared-container" id="shared-content">
        <video id="shared-player" controls autoplay>
            <source id="shared-source" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="shared-actions">
            <a id="download-btn" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download
            </a>
        </div>
        <span class="branding">Timelapse Manager</span>
    </div>
    <script>
        const token = window.location.pathname.split('/').filter(Boolean).pop();
        const videoSrc = `/shared/${token}/video`;
        const downloadHref = `/shared/${token}/download`;

        document.getElementById('shared-source').src = videoSrc;
        document.getElementById('shared-player').load();
        document.getElementById('download-btn').href = downloadHref;
    </script>
</body>
</html>
